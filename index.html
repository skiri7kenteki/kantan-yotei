<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>かんたん予定</title>
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <!-- ホーム画面に追加したときの設定 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="かんたん予定">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 起動画面（アプリの中身が動き出すまで iPad が表示する画像）。向きごとに画面と同じピクセル数が必要。
       今は持ち主の iPad（820x1180 の画面・2 倍密度）用だけ。ホーム画面に追加し直すと反映される -->
  <link rel="apple-touch-startup-image" href="./icons/startup-1640x2360.png"
        media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="./icons/startup-2360x1640.png"
        media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <!-- 画面の切り替え：朝（開いたとき最初に出る）／予定 -->
    <nav class="tabs" aria-label="画面の切り替え">
      <button type="button" class="tab" data-screen="morning">朝</button>
      <button type="button" class="tab" data-screen="list">予定</button>
    </nav>

    <p id="message" class="message" role="status" hidden></p>

    <!-- ===== 朝画面：挨拶・天気・今日の予定・arXiv（iPad では 1 画面に収める。並べ方は style.css） ===== -->
    <div id="screen-morning" class="screen">
      <header class="morning-head">
        <h1 id="greeting"></h1>
        <p id="morning-date" class="morning-date"></p>
      </header>

      <section class="card card-weather">
        <div class="card-title">
          <h2>天気</h2>
          <!-- 地域は iPad の中だけに保存（選択肢は morning.js の WEATHER_PLACES） -->
          <select id="weather-place" class="place-select" aria-label="天気の地域"></select>
        </div>
        <div id="weather"></div>
      </section>

      <section class="card card-today">
        <h2>今日の予定</h2>
        <ul id="list-morning" class="list list-plain"></ul>
        <!-- 枠に入りきらない予定があるときだけ出る（app.js の fitMorningList） -->
        <button type="button" id="morning-more" class="more-link" hidden></button>
        <button type="button" id="go-list" class="btn btn-wide">予定を追加・一覧を見る →</button>
      </section>

      <!-- arXiv の新着：GitHub Actions が毎朝集めた arxiv.json を読む -->
      <section class="card card-arxiv" id="news">
        <h2>arXiv quant-ph 新着 <span id="arxiv-date" class="sub"></span></h2>
        <ul id="news-arxiv" class="news-list"></ul>
        <p id="arxiv-more" class="note"></p>
      </section>
    </div>

    <!-- ===== 予定画面（これまでの画面） ===== -->
    <div id="screen-list" class="screen" hidden>
    <!-- 追加フォーム：タイトルを打って Enter（または「追加」）で完了 -->
    <form id="add-form" class="add" autocomplete="off">
      <div class="add-row">
        <input id="title" class="add-title" type="text" placeholder="予定・やることを入力" enterkeyhint="done" maxlength="200" aria-label="予定のタイトル">
        <button type="submit" class="btn btn-primary">追加</button>
      </div>
      <div class="add-row add-options">
        <div class="chips" role="group" aria-label="日付">
          <button type="button" class="chip" data-day="today">今日</button>
          <button type="button" class="chip" data-day="tomorrow">明日</button>
          <label class="chip chip-date">
            <span id="date-label">日付を選ぶ</span>
            <input id="date" type="date" aria-label="日付を選ぶ">
          </label>
        </div>
        <button type="button" id="time-toggle" class="chip">＋時刻</button>
        <input id="time" class="add-time" type="time" hidden aria-label="時刻">
      </div>
    </form>

    <section class="list-section">
      <h2>今日 <span id="today-label" class="sub"></span></h2>
      <ul id="list-today" class="list"></ul>
    </section>

    <section class="list-section">
      <h2>今週 <span class="sub">明日〜日曜</span></h2>
      <ul id="list-week" class="list"></ul>
    </section>

    <section class="list-section">
      <h2>これから <span class="sub">来週以降</span></h2>
      <ul id="list-later" class="list"></ul>
    </section>

    <!-- バックアップ：JSON ファイルに書き出す／ファイルから戻す -->
    <section class="list-section backup">
      <h2>バックアップ</h2>
      <p class="note">予定はこの端末の中だけに保存されています。ときどき書き出しておくと安心です。</p>
      <div class="backup-buttons">
        <button type="button" id="export" class="btn">書き出し</button>
        <button type="button" id="import" class="btn">読み込み</button>
      </div>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </section>
    </div>

    <footer class="footer">
      <p id="version"></p>
      <!-- 朝・予定のどちらの画面からも使える入口（中身は下の dialog） -->
      <button type="button" id="feedback-open" class="feedback-open">気づきを送る</button>
    </footer>
  </main>

  <!-- 気づきを送る：GitHub の Issue 作成画面を Safari で開く。送信は GitHub の画面で行う（app.js 参照）。
       Enter で勝手に開かないよう、form にはしない（日本語変換の確定でも Enter を使うため） -->
  <dialog id="feedback" class="feedback" aria-labelledby="feedback-title">
    <h2 id="feedback-title">気づきを送る</h2>
    <input id="feedback-text" class="feedback-text" type="text" maxlength="100" placeholder="気づいたことを一行で" enterkeyhint="done" autocomplete="off" aria-label="気づいたこと">
    <p class="note">GitHub の Issue は公開されます。個人的な内容は書かないでください</p>
    <p id="feedback-hint" class="feedback-hint" role="status" hidden></p>
    <div class="feedback-buttons">
      <button type="button" id="feedback-close" class="btn">やめる</button>
      <a id="feedback-send" class="btn btn-primary feedback-send" href="https://github.com/skiri7kenteki/kantan-yotei/issues/new" target="_blank" rel="noopener">GitHub で送る</a>
    </div>
  </dialog>

  <!-- morning.js は関数を用意するだけ。実際に動かすのは app.js（起動時に呼ぶ） -->
  <script src="./morning.js"></script>
  <script src="./app.js"></script>
</body>
</html>
